<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>muadilci — Bakım Modu</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #FAFAF8;
      --border:       #E5E2DC;
      --gold:         #B8935A;
      --gold-bg:      #FBF7F1;
      --gold-border:  #E8D5B3;
      --text:         #0F0F0F;
      --text-mid:     #4A4A4A;
      --text-light:   #8A8A8A;
      --text-muted:   #B8B8B8;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fu   { animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) both; }
    .d1   { animation-delay: 0.05s; }
    .d2   { animation-delay: 0.18s; }
    .d3   { animation-delay: 0.30s; }
    .d4   { animation-delay: 0.45s; }
    .d5   { animation-delay: 0.60s; }
    .d6   { animation-delay: 0.72s; }

    .wrap {
      text-align: center;
      max-width: 460px;
      width: 100%;
    }

    /* Wordmark */
    .wordmark {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 40px;
    }

    /* Gold rule */
    .rule {
      width: 36px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 40px;
    }

    /* Gear icon */
    .icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      border: 1px solid var(--gold-border);
      background: var(--gold-bg);
      margin: 0 auto 32px;
    }

    /* Heading */
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(46px, 10vw, 68px);
      font-weight: 300;
      font-style: italic;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 22px;
    }

    /* Description */
    .desc {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.8;
      color: var(--text-light);
      margin-bottom: 44px;
    }

    /* Buttons */
    .btns {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-mid);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--gold);
      background: var(--gold-bg);
      color: var(--gold);
    }

    .btn svg { flex-shrink: 0; }

    /* Footer */
    .foot {
      margin-top: 64px;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    ::-webkit-scrollbar       { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D4C5A9; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="wordmark fu d1">muadilci</div>

    <div class="rule fu d2"></div>

    <div class="icon-wrap fu d3">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B8935A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </div>

    <h1 class="fu d4">Bakımdayız</h1>

    <p class="desc fu d5">
      Sizi daha iyi bir deneyimle karşılamak için<br />
      kısa bir bakım çalışması yürütüyoruz.<br />
      En kısa sürede geri döneceğiz.
    </p>

    <div class="btns fu d6">
      <a href="https://www.instagram.com/muadilciapp" target="_blank" rel="noopener noreferrer" class="btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        @muadilciapp
      </a>
      <a href="mailto:info@muadilci.com" class="btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
        info@muadilci.com
      </a>
    </div>

    <p class="foot fu d6">© 2026 muadilci.com — Tüm hakları saklıdır.</p>

  </div>
</body>
</html>
