<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>muadilci — Çok Yakında</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #FAFAF8;
      --border:      #E5E2DC;
      --gold:        #B8935A;
      --gold-light:  #C9A46B;
      --gold-bg:     #FBF7F1;
      --gold-border: #E8D5B3;
      --text:        #0F0F0F;
      --text-mid:    #4A4A4A;
      --text-light:  #8A8A8A;
      --text-muted:  #B8B8B8;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* Subtle radial glow behind content */
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(184,147,90,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmerBar {
      0%   { background-position: -300px 0; }
      100% { background-position: 300px 0; }
    }

    .fu { animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) both; }
    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.18s; }
    .d3 { animation-delay: 0.30s; }
    .d4 { animation-delay: 0.44s; }
    .d5 { animation-delay: 0.58s; }
    .d6 { animation-delay: 0.70s; }

    .wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 520px;
      width: 100%;
    }

    /* Wordmark */
    .wordmark {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 40px;
    }

    /* Animated gold rule */
    .rule {
      width: 36px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      background-size: 300px 1px;
      animation: shimmerBar 2.4s linear infinite;
      margin: 0 auto 44px;
    }

    /* Eyebrow label */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .eyebrow-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* Heading */
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(52px, 11vw, 76px);
      font-weight: 300;
      font-style: italic;
      line-height: 1.08;
      color: var(--text);
      margin-bottom: 10px;
    }

    .heading-sub {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 300;
      color: var(--gold-light);
      letter-spacing: 0.04em;
      margin-bottom: 28px;
    }

    /* Description */
    .desc {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.85;
      color: var(--text-light);
      max-width: 380px;
      margin: 0 auto 44px;
    }

    /* Divider dots */
    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 44px;
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold-border);
    }
    .dot.mid { background: var(--gold); }

    /* Buttons */
    .btns {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-mid);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--gold);
      background: var(--gold-bg);
      color: var(--gold);
    }

    /* Footer */
    .foot {
      margin-top: 64px;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    ::-webkit-scrollbar       { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D4C5A9; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="wordmark fu d1">muadilci</div>

    <div class="rule fu d2"></div>

    <div class="eyebrow fu d3">
      <span class="eyebrow-dot"></span>
      Çok yakında
    </div>

    <h1 class="fu d4">Hazırlanıyoruz</h1>
    <div class="heading-sub fu d4">koku dünyası için</div>

    <p class="desc fu d5">
      Lüks parfümlerin muadillerini keşfedebileceğiniz,<br />
      karşılaştırabileceğiniz ve en iyisini bulabileceğiniz<br />
      platform yakında sizlerle.
    </p>

    <div class="dots fu d5">
      <span class="dot"></span>
      <span class="dot mid"></span>
      <span class="dot"></span>
    </div>

    <div class="btns fu d6">
      <a href="https://www.instagram.com/muadilciapp" target="_blank" rel="noopener noreferrer" class="btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        @muadilciapp
      </a>
      <a href="mailto:info@muadilci.com" class="btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
        info@muadilci.com
      </a>
    </div>

    <p class="foot fu d6">© 2026 muadilci.com — Tüm hakları saklıdır.</p>

  </div>
</body>
</html>
